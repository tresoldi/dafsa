# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    project:
      default:
        # The suite covers 100% of branches. `auto` with no threshold means any
        # drop is reported rather than absorbed.
        target: auto
        threshold: 0%
    patch:
      default:
        # New and changed lines are held to the same standard as the rest.
        target: 100%
        threshold: 0%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "tests/**"
  - "benchmarks/**"
  - "docs/**"
