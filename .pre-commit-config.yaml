# Pre-commit hooks mirroring the CI "quality" job.
# Install once with:  pre-commit install
# Run on all files:   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Linter (matches `ruff check .`)
      - id: ruff
        args: [--fix]
      # Formatter (matches `ruff format --check .`)
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^(src/dafsa|tests|benchmarks)/
        # dafsa has no required dependencies; networkx is needed only so that the
        # three graph exports type-check the same way they do in CI.
        additional_dependencies:
          - networkx
          - pytest
